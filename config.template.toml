# Shareable Codex configuration template.
# Copy this file to config.toml and keep machine-specific values local.

model = "gpt-5.3-codex"
model_reasoning_effort = "high"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"
web_search = "live"

# Keep loaded project docs concise to avoid prompt bloat.
project_doc_max_bytes = 32768

# Optional notifications (uncomment one block for your OS).
# Windows:
# notify = ["powershell", "-Command", "[System.Media.SystemSounds]::Exclamation.Play()"]
# macOS:
# notify = ["osascript", "-e", "beep"]
# Linux:
# notify = ["sh", "-lc", "printf '\\a'"]

# Codex reads AGENTS.md by default.
# Optional fallback filenames for non-standard project docs:
# project_doc_fallback_filenames = ["AGENTS.override.md"]

# Stable feature flags.
[features]
# PowerShell on Windows does not support shell snapshots.
shell_snapshot = false
multi_agent = true
apps = true

# Non-Windows shells can opt in to shell snapshots via this profile.
[profiles.posix.features]
shell_snapshot = true

# Optional profile optimized for read-only research and analysis.
[profiles.research]
approval_policy = "never"
sandbox_mode = "read-only"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
web_search = "live"

# Add trusted projects locally.
# [projects.'C:\\path\\to\\project']
# trust_level = "trusted"
# [projects.'/home/user/project']
# trust_level = "trusted"

# Optional platform-specific override.
# [windows]
# sandbox = "elevated"

# Recommended baseline for deeper hierarchical and parallel orchestration.
[agents]
max_depth = 8
max_threads = 8
