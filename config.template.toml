# Shareable Codex configuration template.
# Keep this file short and copy only keys you actually need.
# Copy this file to config.toml and customize locally.

model = "gpt-5.3-codex"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"
web_search = "live"

# Keep AGENTS.md primary, but allow CLAUDE.md fallback.
project_doc_fallback_filenames = ["CLAUDE.md", ".claude/CLAUDE.md"]
# Keep loaded project docs concise to avoid prompt bloat.
project_doc_max_bytes = 32768

# Optional notifications (uncomment one block for your OS).
# Windows:
# notify = ["powershell", "-Command", "[System.Media.SystemSounds]::Exclamation.Play()"]
# macOS:
# notify = ["osascript", "-e", "beep"]
# Linux:
# notify = ["sh", "-lc", "printf '\\a'"]

# Optional compatibility shell hint.
# [shell_environment_policy]
# set = { CLAUDE_CODE_SHELL = "/absolute/path/to/your/shell" }

[features]
shell_snapshot = true
multi_agent = true
apps = true
child_agents_md = true

[tools]
web_search = true

# Optional profile optimized for read-only research and analysis.
[profiles.research]
approval_policy = "never"
sandbox_mode = "read-only"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
web_search = "live"

# Add trusted projects locally.
# [projects.'C:\\path\\to\\project']
# trust_level = "trusted"
# [projects.'/home/user/project']
# trust_level = "trusted"

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"

[windows]
sandbox = "elevated"

[agents]
max_depth = 6
